appId: com.nav1885.micromoment
---
- launchApp:
    clearState: true
- runFlow: _skip_onboarding.yaml

# 1 habit → no hint
- runFlow:
    file: _add_one_habit.yaml
    env:
      HABIT_NAME: "Solo"
- assertNotVisible: "Hold to reorder"

# 2 habits → hint visible
- runFlow:
    file: _add_one_habit.yaml
    env:
      HABIT_NAME: "Duo"
- assertVisible: "Hold to reorder"
