appId: com.nav1885.micromoment
---
- launchApp:
    clearState: true
- runFlow: _skip_onboarding.yaml

- tapOn: "Add Habit"
- tapOn:
    text: "Habit name"
- inputText: "Persist me"
- tapOn: "Save habit"
- assertVisible: "Persist me"

# Stop & relaunch (does NOT clearState)
- stopApp
- launchApp

# Habit still present
- assertVisible: "Persist me"
